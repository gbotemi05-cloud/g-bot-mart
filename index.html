<!DOCTYPE html>
<html lang="en">
<head>
    <link href="./src/output.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body class="px-4 justify-center items-center flex min-h-screen bg-gray-50">
    <div class="p-8 w-full border border-gray-100 shadow-xl rounded-3xl bg-white max-w-md">
        <h1 class="text-green-900 text-center font-black text-3xl"> G-BOT MART</h1>
        <p class="mt-2 text-center text-gray-500">Welcome back. Log in to Continue Shopping.</p>
        <form id="login-form">
            <div>
                <label for="login-email" class="block text-sm mb-2 font-semibold text-gray-700">
                    Email Address
                </label>
                <input type="email" id="login-email" name="email" placeholder="Enter your email" required class="outline-none py-3 px-4 border border-gray-200 rounded-xl w-full focus:border-green-700 focus:ring-2 focus:ring-green-100 transition">
            </div>
            <div>
                <label for="login-password" class="block text-sm mb-4 font-semibold text-gray-700">
                    Password
                </label>
                <input type="password" id="login-password" name="password" placeholder="Enter your password" required class="outline-none py-3 px-4 border border-gray-200 focus:border-green-700 rounded-xl w-full focus:ring-2 focus:ring-green-100 transition">
            </div>
            <button class="w-full bg-green-900 text-white rounded-xl py-3 mt-4 font-bold hover:bg-green-800 transition" type="submit">
                login
            </button>
        </form>
        <p class="text-sm text-center text-gray-500">
            Don't have an account?
            <a href="./signup.html" class="text-green-700 font-semibold hover:text-green-900">
                Sign Up
            </a>
        </p>
    </div>
    <div id="toast" class="bottom-6 right-6 bg-gray-900 px-5 py-3 rounded-xl shadow-lg fixed text-white opacity-0 translate-y-10 transition-all duration-300 z-50">
        <span id="toast-message"></span>
    </div>
    <script src="login.js"></script>
</body>
</html>
