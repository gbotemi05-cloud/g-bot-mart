<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
    <div class="p-8 border border-gray-100 shadow-xl rounded-3xl bg-white max-w-md w-full">
        <h1 class="text-3xl font-black text-green-900 text-center">
            G-BOT MART
        </h1>
        <p class="mt-2 text-center text-gray-500">Create an account and start Shopping with us.</p>
        <form id="signup-form" class="mt-8 space-y-5">
            <div>
                <label for="signup-name" class="text-sm font-semibold text-gray-700 mb-2 block ">
                    Full Name
                </label>
                <input placeholder="Enter your full name" name="fullName" class="rounded-xl w-full border border-gray-200 px-4 py-3 focus:ring-2 focus:border-green-700 focus:ring-green-100  outline-none" type="text" id="signup-name" required>
            </div>
            <div>
                <label for="signup-email" class="text-sm font-semibold text-gray-700 mb-2 block ">
                    Email Address
                </label>
                <input placeholder="Enter your email" name="email" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:ring-2 focus:border-green-700 focus:ring-green-100  outline-none" type="email" id="signup-email" required>
            </div>
            <div class="relative">
                <label for="signup-password" class="text-sm font-semibold text-gray-700 mb-2 block ">
                    Password
                </label>
                <input placeholder="Create a password" minlength="8" name="password" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:ring-2 focus:border-green-700 focus:ring-green-100  outline-none" type="password" id="signup-password" required>
                 <img src="eye-close.png" alt="" class="absolute w-3.5 right-3 bottom-2 cursor-pointer" id="toggle-password">
                
                <p class="mt-2 text-xs text-gray-500">
                    At least 8 characters, 1 uppercase letter, 1 number, and 1 symbol.
                </p>
            </div>
            <div class="relative">
                <label for="signup-password" class="text-sm font-semibold text-gray-700 mb-2 block ">
                   Confirm Password
                </label>
                <input placeholder="Re-enter your password" minlength="8" name="confirmPassword" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:ring-2 focus:border-green-700 focus:ring-green-100  outline-none" type="password" id="confirm-password" required>
                <img src="eye-close.png" alt="" class="absolute w-3.5 right-3 bottom-5 cursor-pointer" id="toggle-confirm-password">
            </div>
            
            <button type="submit" class="w-full bg-green-900 text-white font-bold py-3 mt-2 rounded-xl hover:bg-green-800">
                Sign-Up
            </button>
        </form>
         <p class="text-sm text-center text-gray-500">
            Already have an account?
            <a href="./index.html" class="text-green-700 font-semibold hover:text-green-900">
                Log In
            </a>
        </p>
    </div>
    <div id="toast" class="bottom-6 right-6 bg-gray-900 px-5 py-3 rounded-xl shadow-lg fixed text-white opacity-0 translate-y-10 transition-all duration-300 z-50">
        <span id="toast-message"></span>
    </div>
    <script src="./signup.js"></script>
</body>
</html>
